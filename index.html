<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d12" />
    <meta name="description" content="Race and battle Anki Overdrive Fast &amp; Furious Edition cars from your browser." />
    <title>Overdrive Revival</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0d12'/%3E%3Cpath d='M18 4 8 18h7l-1 10 10-14h-7z' fill='%23ffd23f'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#drive" aria-label="Overdrive Revival, go to Drive">
        <svg class="brand-mark" viewBox="0 0 32 32" width="28" height="28" aria-hidden="true">
          <rect width="32" height="32" rx="7" fill="currentColor" opacity="0.12" />
          <path d="M18 4 8 18h7l-1 10 10-14h-7z" fill="currentColor" />
        </svg>
        <span class="brand-name">Overdrive <em>Revival</em></span>
      </a>
      <nav class="tabs" id="tabs" aria-label="Sections"></nav>
      <div class="topbar-actions">
        <button class="icon-button" id="mute" type="button" aria-pressed="false" aria-label="Mute sound"></button>
        <button class="stop-all" id="stop-all" type="button" title="Stop every car and end the race or battle (Esc)">Stop all</button>
      </div>
    </header>

    <main id="view" tabindex="-1"></main>

    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

    <noscript>
      <p class="noscript">Overdrive Revival needs JavaScript to talk to the cars.</p>
    </noscript>
    <script type="module" src="js/ui/app.js"></script>
  </body>
</html>
